<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logos/insolify-logomark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insolify | Core banking, AI and payments infrastructure</title>
    <meta
      name="description"
      content="Insolify builds Fincore, a core banking platform for microfinance banks and fintechs, plus Safi AI and Settle Africa."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="/logos/insolify-logomark.svg" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (!t)
            t = matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
